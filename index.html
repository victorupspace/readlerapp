<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Readler</title>
    <meta name="description" content="Readler: tradutor pessoal para estudar francês, alemão, inglês e italiano. Leia, traduza, aprenda." />
    <meta name="application-name" content="Readler" />
    <meta name="apple-mobile-web-app-title" content="Readler" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f131c" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Readler" />
    <meta property="og:description" content="Leia, traduza, aprenda." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Applies the saved theme (or the system one) before the first paint, so
      // the page never flashes in the wrong theme. Keep colors in sync with
      // src/hooks/useTheme.ts.
      (function () {
        var stored = null;
        try {
          stored = JSON.parse(localStorage.getItem('readler:theme'));
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        if (stored === 'dark' || stored === 'light') {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', dark ? '#0f131c' : '#f3f4f7');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
